name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly secret-scan sweep of the default branch.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / format / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Build BEFORE test: vitest-pool-workers loads wrangler.jsonc, whose
      # assets.directory is ./dist/client. `npm run pretest` also creates it, so
      # tests pass standalone, but building first exercises the real artifact.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Free for public repositories. If this repo is ever made private, either
      # set GITLEAKS_LICENSE or swap to the pinned binary:
      #   curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/vX.Y.Z/gitleaks_X.Y.Z_linux_x64.tar.gz
      #   tar -xzf gitleaks.tar.gz && ./gitleaks detect --no-banner --redact --exit-code 1
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
