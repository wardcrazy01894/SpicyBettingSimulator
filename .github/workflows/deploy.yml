name: Deploy

# Deploys main to Cloudflare Workers (https://spicybetting.wardcrazy01894.workers.dev).
# Runs on every push to main and on demand. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template + Account → D1 → Edit
#   CLOUDFLARE_ACCOUNT_ID  — from `npx wrangler whoami`
# Until they exist this workflow fails at the first wrangler step; manual
# `npm run deploy` from a logged-in machine keeps working (docs/OPERATIONS.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: migrate + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The merge path to main is already gated by required checks; this gate
      # protects the manual "Run workflow" path too (and costs ~1 min).
      - name: Gate (typecheck, lint, format, tests)
        run: npm run typecheck && npm run lint && npm run format:check && npm test

      - name: Build the SPA
        run: npm run build:web

      - name: Apply pending D1 migrations (remote)
        run: npx wrangler d1 migrations apply spicybetting --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf https://spicybetting.wardcrazy01894.workers.dev/api/health | grep -q '"ok":true'; then
              echo "health ok"; exit 0
            fi
            sleep 5
          done
          echo "health check failed"; exit 1
