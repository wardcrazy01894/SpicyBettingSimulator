# Dependabot: keep npm packages and GitHub Actions current.
#
# Every PR it opens still goes through the normal merge gate — CI plus an
# adversarial review (CLAUDE.md, "dependency bumps included"). Nothing here
# auto-merges.
#
# Grouping keeps the PR count sane: one weekly PR for all minor/patch bumps,
# one per major (outside the two named groups, which take majors too), one for
# all GitHub Actions. The Cloudflare toolchain
# (`wrangler`, `@cloudflare/vitest-plugin`, `@cloudflare/workers-types`)
# is its own group so it is REVIEWED in one place, because bumping it has a
# rule attached: `compatibility_date` in wrangler.jsonc must not be newer than
# the workerd bundled with the PLUGIN, and the plugin bounds the vitest major
# through its peerDependencies. The three are not required to move in lockstep
# — the plugin pins its own wrangler exactly, so the top-level wrangler's
# workerd may differ from it (today they are the same version) — but a reviewer
# needs them side by side to check those two constraints. See PLAN.md §15 and
# docs/OPERATIONS.md "Dependencies".
#
# The `ignore` entries encode the ceilings in PLAN.md §15's "Why not latest"
# table — three ceilings, four entries: vitest 5 is a major the plugin now
# accepts but the repo adopts deliberately, in its own PR, not via a grouped bump
# (`@vitest/*` rides with it because `@vitest/coverage-v8` peers on an EXACT
# vitest version); typescript >= 6.1 is outside typescript-eslint's range
# (6.0.x is inside it, so only 6.1+ is ignored); @vitejs/plugin-react 6 drags
# in peers we do not use. `tests/unit/docs.spec.ts` asserts this list and that
# table name the same packages, so lifting a ceiling means editing both.
# NOTE: `ignore` also filters SECURITY updates — a CVE fixed only in an ignored
# major produces no PR; the alert still shows in the Security tab.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Detroit
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      # First match wins, so this precedes the catch-all below.
      cloudflare:
        patterns:
          - wrangler
          - '@cloudflare/*'
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        versions: ['>=6.1.0']
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Detroit
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
