# Dependabot: keep npm packages and GitHub Actions current.
#
# Every PR it opens still goes through the normal merge gate — CI plus an
# adversarial review (CLAUDE.md, "dependency bumps included"). Nothing here
# auto-merges.
#
# Grouping keeps the PR count sane: one weekly PR for all minor/patch bumps,
# one per major, one for all GitHub Actions. The Cloudflare toolchain
# (`wrangler`, `@cloudflare/vitest-pool-workers`, `@cloudflare/workers-types`)
# is its own group so it is REVIEWED in one place, because bumping it has a
# rule attached: `compatibility_date` in wrangler.jsonc is pinned to the newest
# date the workerd bundled with the POOL supports, and the pool pins the vitest
# major through its peerDependencies. The three are not required to move in
# lockstep — the pool ships its own nested wrangler and is green today with a
# different workerd than the top-level one — but a reviewer needs them side by
# side to check those two constraints. See PLAN.md §15 and docs/OPERATIONS.md
# "Dependencies".
#
# The `ignore` entries encode the ceilings in PLAN.md §15's "Why not latest"
# table — three ceilings, four entries: vitest 5 is unsupported by the pool
# (`@vitest/*` rides with it because `@vitest/coverage-v8` peers on an EXACT
# vitest version); typescript >= 6.1 is outside typescript-eslint's range
# (6.0.x is inside it, so only 6.1+ is ignored); @vitejs/plugin-react 6 drags
# in peers we do not use. `tests/unit/docs.spec.ts` asserts this list and that
# table name the same packages, so lifting a ceiling means editing both.
# NOTE: `ignore` also filters SECURITY updates — a CVE fixed only in an ignored
# major produces no PR; the alert still shows in the Security tab.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Detroit
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      # First match wins, so this precedes the catch-all below.
      cloudflare:
        patterns:
          - wrangler
          - '@cloudflare/*'
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        versions: ['>=6.1.0']
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Detroit
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
