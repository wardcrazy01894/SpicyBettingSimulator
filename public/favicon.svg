<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Site icon: a gold "$" coin with a flame rising off it, on the app's dark
    background. The flame is the "spicy" and the coin is the (fake) money; the
    orange and the dark are the accent / bg tokens from styles.css so the tab
    icon matches the app. The rasterised copies next to this file
    (favicon-*.png, apple-touch-icon.png, favicon.ico) are generated from it;
    see the Icons note in README.md.
  -->
  <rect width="64" height="64" rx="14" fill="#0f1115"/>
  <path
    fill="#ff5a1f"
    d="M36 4c1 7-7 10-9 17-1.5 5 1 10 6 12-2-4 0-8 2-11 1.5 3 4 4 5 7 .5 2 0 4-1 5 5-2 8-6 7-12-1-6-6-8-7-13-1 2-2 3-3 4-1-3 1-6 0-9z"
  />
  <circle cx="32" cy="42" r="17" fill="#f1c40f"/>
  <circle cx="32" cy="42" r="13.5" fill="none" stroke="#c8981a" stroke-width="2"/>
  <text
    x="32"
    y="51"
    text-anchor="middle"
    font-family="Helvetica, Arial, system-ui, sans-serif"
    font-weight="900"
    font-size="26"
    fill="#0f1115"
  >
    $
  </text>
</svg>
